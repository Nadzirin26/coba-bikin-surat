<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editor kartu Nabila</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body class="editor"><main><header class="editor-head"><div><p class="eyebrow">RUANG KECIL MILIKMU</p><h1>Kartu untuk Nabila.</h1><p class="muted">Terbuka 10 Oktober 2026 · 00.00 WIB</p></div><a class="text-link" href="/" target="_blank" rel="noopener">Lihat kartu ↗</a></header><section id="login-panel" class="paper"><h2>Masuk ke editor</h2><p class="muted">Kamu bisa mengedit dan melihat kejutan sebelum hari ulang tahunnya.</p><form id="login"><label>Kata sandi<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Masuk ♡</button></form></section><section id="edit-panel" hidden><div class="editor-actions"><p class="muted">Isi kartu bisa kamu ubah kapan saja.</p><button type="button" class="secondary" id="logout">Keluar</button></div><form id="edit" class="paper"><label>Nama/panggilan<input name="name" maxlength="80" required></label><label>Dari siapa<input name="sender" maxlength="120" required></label><label>Judul ucapan<input name="title" maxlength="160" required></label><label>Kalimat pembuka<textarea name="intro" rows="3" maxlength="500" required></textarea></label><label>Surat untuk dia<textarea name="message" rows="12" maxlength="8000" required></textarea></label><label>Doa kecil<textarea name="wish" rows="3" maxlength="1000" required></textarea></label><div class="editor-actions"><button type="submit">Simpan ucapan ♡</button><a class="text-link" href="/" target="_blank" rel="noopener">Lihat versi tersimpan ↗</a></div><p class="muted">Pratinjau kartu menggunakan ucapan yang sudah disimpan.</p></form></section><p id="status" role="status"></p></main></body></html>
